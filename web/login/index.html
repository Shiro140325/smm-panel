<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SMM Shiro</title>
<meta name="theme-color" content="#F4F4F4">
<script>/* apply saved theme before first paint */(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="theme-corner"><button class="theme-btn" type="button" data-theme-toggle aria-label="Theme"></button></div>
<main class="auth-page">
  <div class="card auth-card">
    <a class="brand brand-lg" href="/" aria-label="SMM Shiro home" style="align-self:center"><img class="logo-ink" src="/assets/img/logo.png" alt="SMM Shiro" width="132" height="44"></a>
    <div class="tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Create account</button>
    </div>
    <form id="auth-form" novalidate style="display:flex;flex-direction:column;gap:16px">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required>
        <span class="hint" id="pw-hint">At least 8 characters.</span>
      </div>
      <div class="alert alert-info hidden" id="ref-hint" role="status">You were invited by a friend. Welcome to SMM Shiro!</div>
      <div class="alert alert-bad hidden" id="auth-error" role="alert"></div>
      <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit">Log in</button>
    </form>
    <form class="vf-step hidden" id="verify-step" novalidate>
      <h1 id="vf-title">Check your email</h1>
      <p class="vf-text">We sent a 6-digit code to <strong id="vf-email"></strong>. <span id="vf-tail">Enter it to finish setting up your account.</span></p>
      <input class="input vf-code" id="vf-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="••••••" aria-label="6-digit code">
      <div class="vf-msg" id="vf-msg" role="alert"></div>
      <button class="btn btn-primary btn-lg btn-block" id="vf-go" type="submit">Verify</button>
      <div class="vf-row">
        <button type="button" class="btn btn-ghost btn-sm" id="vf-resend" disabled>Send a new code</button>
        <button type="button" class="btn btn-ghost btn-sm" id="vf-change-open">Wrong email?</button>
      </div>
      <div class="vf-change hidden" id="vf-change">
        <input class="input" id="vf-new-email" type="email" autocomplete="email" placeholder="Correct email">
        <button type="button" class="btn btn-secondary" id="vf-change-go">Send code</button>
      </div>
      <p class="hint" style="margin:0;text-align:center">Can't find it? Check Spam or Promotions. It can take a minute.
        <br><button type="button" class="btn btn-ghost btn-sm" id="vf-logout" style="margin-top:6px">Log out</button></p>
    </form>
    <p class="hint" style="text-align:center">By continuing you agree to the <a href="/terms/">Terms of service</a> and <a href="/privacy/">Privacy policy</a>.</p>
  </div>
</main>
<script type="module">
  import { api, initTheme, rememberRef } from "/assets/common.js";
  import { icons } from "/assets/icons.js";
  initTheme(icons);

  const params = new URLSearchParams(location.search);
  const ref = rememberRef();
  let mode = params.get("mode") === "register" || params.get("ref") ? "register" : "login";
  const $ = (id) => document.getElementById(id);

  function setMode(m) {
    mode = m;
    $("tab-login").setAttribute("aria-selected", m === "login");
    $("tab-register").setAttribute("aria-selected", m === "register");
    $("submit").textContent = m === "login" ? "Log in" : "Create account";
    $("password").autocomplete = m === "login" ? "current-password" : "new-password";
    $("pw-hint").classList.toggle("hidden", m === "login");
    $("ref-hint").classList.toggle("hidden", m === "login" || !ref);
    $("auth-error").classList.add("hidden");
    document.title = (m === "login" ? "Log in" : "Create account") + " — SMM Shiro";
  }
  $("tab-login").onclick = () => setMode("login");
  $("tab-register").onclick = () => setMode("register");
  setMode(mode);

  // already logged in? go straight to the dashboard (after the email code, if it's still needed)
  api("/auth/me").then((me) => (me.verify_required && !me.email_verified ? showVerify(me.email) : location.replace("/dashboard/")))
    .catch(() => {});

  /* ---------- email code: required before the dashboard, for new and existing accounts */
  let timer = null;
  const msg = (t, ok = false) => { $("vf-msg").textContent = t; $("vf-msg").classList.toggle("ok", ok); };
  function countdown(sec) {
    clearInterval(timer);
    let left = sec;
    const paint = () => { $("vf-resend").disabled = left > 0; $("vf-resend").textContent = left > 0 ? `Send a new code (${left}s)` : "Send a new code"; };
    paint();
    timer = setInterval(() => { left -= 1; paint(); if (left <= 0) clearInterval(timer); }, 1000);
  }
  function sent(r) { msg("Code sent.", true); countdown(r.resend_in || 60); }
  function sendFailed(e) {
    const wait = /Wait (\d+) seconds/.exec(e.message || "");
    if (wait) { msg("We just sent you a code. It still works.", true); countdown(Number(wait[1])); }
    else { msg(e.message); countdown(e.status === 429 ? 60 : 5); }
  }
  let codeMode = "verify";   // "verify": new/unverified account · "login": the code every login needs
  async function send() {
    $("vf-resend").disabled = true;
    try { sent(await api(codeMode === "login" ? "/auth/login/resend" : "/auth/verify/send", { method: "POST" })); }
    catch (e) {
      if (e.status === 401 && codeMode === "login") { msg(e.message); setTimeout(() => location.replace("/login/"), 1500); return; }
      sendFailed(e);
    }
  }
  function showLoginCode(res) {
    codeMode = "login";
    document.querySelector(".tabs").classList.add("hidden");
    $("auth-form").classList.add("hidden");
    $("verify-step").classList.remove("hidden");
    $("vf-title").textContent = "Enter your login code";
    $("vf-email").textContent = res.sent_to;
    $("vf-tail").textContent = "Enter it to log in.";
    $("vf-change-open").classList.add("hidden");
    $("vf-logout").textContent = "Back";
    document.title = "Login code — SMM Shiro";
    msg("Code sent.", true);
    countdown(res.resend_in || 60);
    setTimeout(() => $("vf-code").focus(), 100);
  }
  function showVerify(email) {
    document.querySelector(".tabs").classList.add("hidden");
    $("auth-form").classList.add("hidden");
    $("verify-step").classList.remove("hidden");
    $("vf-email").textContent = email;
    document.title = "Verify your email — SMM Shiro";
    send();
    setTimeout(() => $("vf-code").focus(), 100);
  }
  $("verify-step").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("vf-code").value.replace(/\D/g, "");
    if (code.length !== 6) { msg("Enter the 6 digits from the email."); $("vf-code").focus(); return; }
    $("vf-go").disabled = true;
    $("vf-go").textContent = "Checking…";
    try {
      await api(codeMode === "login" ? "/auth/login/verify" : "/auth/verify", { method: "POST", body: { code } });
      $("vf-go").textContent = "Verified";
      location.replace("/dashboard/");
    } catch (ex) {
      msg(ex.message);
      if (ex.status === 401 && codeMode === "login") { setTimeout(() => location.replace("/login/"), 1500); return; }
      $("vf-go").disabled = false;
      $("vf-go").textContent = "Verify";
      $("vf-code").select();
    }
  });
  $("vf-code").addEventListener("input", (e) => { if (e.target.value.replace(/\D/g, "").length === 6) $("verify-step").requestSubmit(); });
  $("vf-resend").addEventListener("click", send);
  $("vf-change-open").addEventListener("click", () => { $("vf-change").classList.toggle("hidden"); $("vf-new-email").focus(); });
  $("vf-change-go").addEventListener("click", async () => {
    const email = $("vf-new-email").value.trim();
    if (!email) { $("vf-new-email").focus(); return; }
    $("vf-change-go").disabled = true;
    try {
      const r = await api("/auth/verify/email", { method: "POST", body: { email } });
      $("vf-email").textContent = r.email;
      $("vf-change").classList.add("hidden");
      $("vf-code").value = "";
      sent(r);
    } catch (e) { msg(e.message); }
    $("vf-change-go").disabled = false;
  });
  $("vf-logout").addEventListener("click", async () => {
    if (codeMode !== "login") try { await api("/auth/logout", { method: "POST" }); } catch { /* ignore */ }
    location.replace("/login/");
  });

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    const password = $("password").value;
    const err = $("auth-error");
    err.classList.add("hidden");
    if (!email || !password) { err.textContent = "Enter your email and password."; err.classList.remove("hidden"); return; }
    if (mode === "register" && password.length < 8) { err.textContent = "Password must be at least 8 characters."; err.classList.remove("hidden"); return; }
    $("submit").disabled = true;
    try {
      const res = await api(mode === "login" ? "/auth/login" : "/auth/register", { method: "POST", body: mode === "register" && ref ? { email, password, ref } : { email, password } });
      // new account: the dashboard opens with the welcome guide (and the free trial order, when offered)
      if (mode === "register") { try { localStorage.setItem("tour", res.trial && (res.trial.available || res.trial.needs_verify) ? "trial" : "guide"); localStorage.removeItem("tourStep"); } catch { /* private mode */ } }
      if (res.code_required) showLoginCode(res);
      else if (res.verify_required && !res.email_verified) showVerify(res.email);
      else location.replace("/dashboard/");
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove("hidden");
      $("submit").disabled = false;
    }
  });
</script>
</body>
</html>
